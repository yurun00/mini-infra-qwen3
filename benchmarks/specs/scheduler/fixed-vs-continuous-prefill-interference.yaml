# yaml-language-server: $schema=../suite.schema.json
name: fixed-vs-continuous-prefill-interference
extends: _bases/fixed_vs_continuous.yaml
description: 长 Prompt 在中途插入，引起持续的计算与缓存搬移开销。
workload:
  id: prefill_interference
  groups:
    - {count: 2, prompt_len: 128, output_len: 32, arrival_ms: 0}
    - {count: 1, prompt_len: 512, output_len: 8, arrival_ms: 250}
checks:
  - min_max_running_requests: 3
