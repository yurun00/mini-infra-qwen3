name: serial-vs-fixed-batch-throughput
engine: lockstep
description: >-
  对每个 batch size，分别用 serial（逐请求串行）与 fixed-batching 两种路径，
  在固定长度 prompt、固定输出长度、忽略 EOS 的条件下测量吞吐与显存。
execution:
  warmup: 1
  repeats: 3
system:
  batching_method: [none, fixed-batching]
  caching_method: [dense-kv-cache]
workload:
  id: "batch_${num_requests}"
  vars:
    num_requests: 1
  count: "${num_requests}"
  prompt_len: 128
  output_len: 32
sweep:
  workload:
    num_requests: [1, 2, 4, 8, 16]
checks:
  - min_output_len: 2
