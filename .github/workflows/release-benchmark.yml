name: release-benchmark

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (例如 v0.2.0)'
        required: false
        default: 'manual-release'
      release_feature:
        description: 'Release Feature (例如 "KV cache")'
        required: false
        default: ''

jobs:
  benchmark:
    # 仅在发布 Minor Release / Feature Tag 时触发全量矩阵 Benchmark
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[bench,compare]"

      - name: Run Full Case Benchmark
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG="${{ inputs.tag || 'manual-release' }}"
          fi

          # 1. 优先使用手动指定的 release_feature
          FEATURE="${{ inputs.release_feature }}"

          # 2. 若为空且已有同 TAG 的历史归档，优先提取其 release_feature 保持同构
          if [[ -z "$FEATURE" ]]; then
            FEATURE=$(python3 -c "import glob, json; files=glob.glob('benchmarks/result-history/*_${TAG}.json'); print(json.load(open(files[0])).get('release_feature', '') if files else '')" 2>/dev/null || true)
          fi

          # 3. 若仍为空，尝试从 Git annotated tag 的注释中提取（如 'Release v0.2.0: KV cache' -> 'KV cache'）
          if [[ -z "$FEATURE" ]]; then
            RAW_MSG=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null || true)
            if [[ -n "$RAW_MSG" ]]; then
              FEATURE=$(echo "$RAW_MSG" | sed -E 's/^Release [^:]+: //I' | xargs)
            fi
          fi

          echo "Running benchmark for tag: $TAG (release_feature: ${FEATURE:-none})"
          if [[ -n "$FEATURE" ]]; then
            .venv/bin/mini-infra bench batch case --tag "$TAG" --release-feature "$FEATURE" --profile-mode extra-profile
          else
            .venv/bin/mini-infra bench batch case --tag "$TAG" --profile-mode extra-profile
          fi

      - name: Generate Reports and Evolution Plots
        run: |
          .venv/bin/mini-infra bench plot history

      - name: Update Regression Reference for Future Commits
        run: |
          .venv/bin/mini-infra bench check-regression --update-reference

      - name: Upload Benchmark Reports & Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ github.ref_name }}
          path: |
            benchmarks/reports/
            benchmarks/result-history/
            benchmarks/data/
