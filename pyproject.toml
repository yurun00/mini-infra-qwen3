[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-infra-qwen3"
version = "0.1.0"
description = "超轻量 AI Infra 教程 — 手写 Qwen3 推理与性能工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
compare = [
    "transformers>=4.45.0",
]

[tool.setuptools.packages.find]
where = ["src"]
