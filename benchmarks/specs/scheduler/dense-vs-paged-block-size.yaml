# yaml-language-server: $schema=../suite.schema.json
name: dense-vs-paged-block-size
extends: _bases/dense_vs_paged.yaml
description: 扫描 Paged physical block 大小（8/16/32/64）；dense 作为基线只出现一次。
workload:
  id: block_size_sweep
sweep:
  system:
    caching_spec:
      - dense-kv-cache
      - {kind: paged-kv-cache, block_size: 8}
      - {kind: paged-kv-cache, block_size: 16}
      - {kind: paged-kv-cache, block_size: 32}
      - {kind: paged-kv-cache, block_size: 64}
