name: pr-perf-regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  perf:
    # 需要带 NVIDIA GPU 的 self-hosted runner，且与 benchmarks/data/reference.json 的 GPU 型号一致
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[bench]"
      - name: Performance regression check (threshold 5%)
        run: .venv/bin/mini-infra bench check-regression --strict-hardware
      - name: Upload candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-candidate
          path: benchmarks/candidate.local.json
